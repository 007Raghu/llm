    `llama.cpp` is the most common (and works on Windows 11).\n\n```bash\n# If you\
    \ have Git Bash / WSL / PowerShell with git\ngit clone https://github.com/ggerganov/llama.cpp\n\
    cd llama.cpp\nmkdir build && cd build\ncmake .. -DLLAMA_CUDA=ON   # enable CUDA\
    \ for your RTX 3050\ncmake --build . --config Release\n```\n\nIf you don’t want\
    \ to compile, grab a pre‑built binary from the repo’s **Releases** page (look\
    \ for `llama.exe` with `CUDA`).\n\n### 2. Put the model where the runner can see\
    \ it\n```bash\n# Move the file (replace the real name if needed)\nmove \"%USERPROFILE%\\\
    Downloads\\my-model.gguf\" \"%USERPROFILE%\\Documents\\gguf_models\\\"\n```\n\
    Or just keep it in `Downloads`; just remember the full path.\n\n### 3. Run a quick\
    \ test\n```bash\n# From the llama.cpp folder\nllama.exe --model \"C:\\Users\\\
    Raghu\\Documents\\gguf_models\\my-model.gguf\" \\\n          --sample_len 256\
    \ \\\n          --temp 0.85 \\\n          --top_k 40 \\\n          --logit_bias\
    \ '' \\\n          --prompt \"A photorealistic portrait of a cyber‑punk cat, 4k,\
    \ vibrant colors\"\n```\n- `--sample_len` = how many tokens the model spits out\
    \ (256 is a good start for an image prompt).\n- `--temp` = randomness (0.7‑0.9\
    \ works well).\n- Adjust `--top_k` / `--top_p` if you need more/less variety.\n\
    \nThe output will be a **text prompt** that you feed to an actual image generator\
    \ (Stable Diffusion, SDXL, etc.). Some GGUF models are “text‑to‑image” themselves\
    \ and will *directly* emit base‑64 PNG data; if that’s the case, just pipe the\
    \ output to a file:\n\n```bash\nllama.exe … > out.txt\n# extract the base64 block\
    \ and decode\ntype out.txt | findstr /R \"^data:image\" > img.b64\ncertutil -decode\
    \ img.b64 img.png\n```\n\n### 4. Hook it up to a UI (optional but nice)\nIf you\
    \ want a graphical front‑end:\n\n| UI | How to add GGUF |\n|----|-----------------|\n\
    | **ComfyUI** | Install the `ComfyUI-gguf` node (pip install comfyui‑gguf) and\
    \ point it at your `.gguf` file. |\n| **Automatic1111** | Use the “Model Converter”\
    \ extension to import a GGUF as a checkpoint, then select it in the txt2img tab.\
    \ |\n| **InvokeAI** | Edit `invokeai.yaml` → `models.diffusion` with the GGUF\
    \ path, then `invokeai-configure` to refresh. |\n\n### 5. Quick‑start script (Windows\
    \ batch)\n\n```bat\n@echo off\nset MODEL=%USERPROFILE%\\Documents\\gguf_models\\\
    my-model.gguf\nset PROMPT=\"A futuristic city at sunset, ultra‑realistic, 8k\"\
    \nllama.exe --model \"%MODEL%\" --prompt %PROMPT% --sample_len 256 --temp 0.85\
    \ > result.txt\ntype result.txt\npause\n```\n\nRun the `.bat` file, copy the generated\
    \ text into your favorite image gen UI, and boom—image.\n\n---\n\n#### TL;DR\n\
